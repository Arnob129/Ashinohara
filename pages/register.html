<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — DevFolio</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <div class="auth-bg-grid"></div>

  <div class="auth-card" id="authCard" style="max-width:480px;">

    <div class="auth-card__logo">
      <a href="../index.html">
        <span class="nav__brand-dot"></span>AR DevFolio
      </a>
    </div>

    <h1>Create account</h1>
    <p class="auth-card__sub">
      Already have one? <a href="login.html">Sign in →</a>
    </p>

    <form class="auth-form" id="registerForm" novalidate>

      <div class="name-row">
        <div class="field">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" placeholder="Alex" autocomplete="given-name" />
          <span class="field__error" id="firstNameErr"></span>
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" placeholder="Rahman" autocomplete="family-name" />
          <span class="field__error" id="lastNameErr"></span>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <span class="field__error" id="emailErr"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" />
          <button type="button" class="password-toggle" id="togglePwd" aria-label="Show password">👁</button>
        </div>
        <div class="strength-bar" id="strengthBar">
          <span id="sb1"></span><span id="sb2"></span><span id="sb3"></span><span id="sb4"></span>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
        <span class="field__error" id="pwdErr"></span>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="password-wrap">
          <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" />
          <button type="button" class="password-toggle" id="toggleConfirm" aria-label="Show password">👁</button>
        </div>
        <span class="field__error" id="confirmErr"></span>
      </div>

      <label class="checkbox-label" style="font-size:0.82rem;">
        <input type="checkbox" id="terms" />
        <span>I agree to the <a href="#" style="color:var(--accent);">Terms of Service</a> and <a href="#" style="color:var(--accent);">Privacy Policy</a></span>
      </label>
      <span class="field__error" id="termsErr"></span>

      <button type="submit" class="btn-solid btn-lg btn-full" id="registerBtn">Create account</button>

      <div class="auth-divider">or sign up with</div>

      <button type="button" class="btn-social">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

    </form>

    <div class="auth-footer">
      <a href="../index.html">← Back to portfolio</a>
    </div>
  </div>

  <style>
    .auth-bg-grid {
      position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    #authCard {
      opacity: 0; transform: translateY(24px);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: none; } }

    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) { .name-row { grid-template-columns: 1fr; } }

    .checkbox-label {
      display: flex; align-items: flex-start; gap: 0.5rem;
      color: var(--fg2); cursor: pointer; line-height: 1.5;
    }
    .checkbox-label input { accent-color: var(--accent); width: 15px; height: 15px; margin-top: 2px; cursor: pointer; flex-shrink: 0; }

    .btn-social {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      width: 100%; padding: 0.75rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
      color: var(--fg); font-family: var(--ff-sans);
      font-size: 0.88rem; font-weight: 600;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-social:hover { border-color: var(--fg3); background: var(--bg); }

    .register-success {
      display: none; text-align: center;
      padding: 1rem; margin-top: 1rem;
      background: rgba(76,175,80,0.08);
      border: 1px solid rgba(76,175,80,0.25);
      border-radius: 8px; color: #4caf50;
      font-size: 0.88rem; line-height: 1.6;
    }
  </style>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
